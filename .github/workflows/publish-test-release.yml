name: Publish Universal APK Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-test-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified customized build artifact
        uses: actions/download-artifact@v4
        with:
          name: feature-apks-0.6.2
          path: artifact
          repository: ${{ github.repository }}
          run-id: 46132128512
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish customized universal APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="artifact/app-universal-release.apk"
          test -s "$APK"
          gh release view test-latest >/dev/null 2>&1 || gh release create test-latest --title "MusicFree 定制版测试包" --notes "来自 feature/remote-server-management 分支构建。测试签名，仅供测试安装。"
          gh release edit test-latest --title "MusicFree 定制版测试包" --notes "来自 feature/remote-server-management 分支构建。测试签名，仅供测试安装。"
          gh release upload test-latest "$APK" --clobber
